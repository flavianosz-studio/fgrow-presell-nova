<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FGrow</title>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-18128505759">
</script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'AW-18133385384');
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { width: 100%; height: 100%; }

body {
  font-family: 'Plus Jakarta Sans', Arial, sans-serif;
  min-height: 100vh;
  background-color: #0d0d0d;
  background-image: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(124, 58, 237, 0.4) 0%, transparent 70%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.card {
  background: #1c1c1e;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 24px;
  padding: 48px 40px 40px;
  width: 100%;
  max-width: 520px;
  text-align: center;
  animation: rise 0.5s ease both;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}

.logo {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 28px;
}

.logo-icon {
  width: 44px;
  height: 44px;
  background: linear-gradient(135deg, #9333ea, #7c3aed);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.logo-name {
  font-size: 22px;
  font-weight: 800;
  color: #ffffff;
  letter-spacing: -0.3px;
}

.logo-name span { color: #a855f7; }

h1 {
  font-size: 42px;
  font-weight: 800;
  color: #ffffff;
  letter-spacing: -1px;
  margin-bottom: 16px;
  line-height: 1.15;
}

p {
  font-size: 15px;
  color: rgba(255, 255, 255, 0.45);
  line-height: 1.75;
  margin-bottom: 36px;
  max-width: 380px;
  margin-left: auto;
  margin-right: auto;
}

.btn-row {
  display: flex;
  gap: 14px;
  justify-content: center;
  margin-bottom: 36px;
  flex-wrap: wrap;
}

.btn-accept {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 16px 32px;
  background: linear-gradient(135deg, #c026d3, #9333ea);
  color: #fff;
  font-family: 'Plus Jakarta Sans', Arial, sans-serif;
  font-size: 15px;
  font-weight: 700;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  box-shadow: 0 6px 28px rgba(192, 38, 211, 0.45);
  transition: opacity 0.15s, transform 0.15s;
  white-space: nowrap;
}

.btn-accept:hover  { opacity: 0.88; transform: translateY(-1px); }
.btn-accept:active { opacity: 1; transform: translateY(0); }

.btn-close {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 16px 32px;
  background: transparent;
  color: #fff;
  font-family: 'Plus Jakarta Sans', Arial, sans-serif;
  font-size: 15px;
  font-weight: 700;
  border: 1.5px solid rgba(255, 255, 255, 0.18);
  border-radius: 50px;
  cursor: pointer;
  transition: border-color 0.15s, transform 0.15s;
  white-space: nowrap;
}

.btn-close:hover  { border-color: rgba(255,255,255,0.4); transform: translateY(-1px); }
.btn-close:active { transform: translateY(0); }

.divider {
  border: none;
  border-top: 1px solid rgba(255, 255, 255, 0.07);
  margin-bottom: 24px;
}

.links {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
  flex-wrap: wrap;
}

.links a {
  font-size: 13px;
  color: rgba(255, 255, 255, 0.3);
  text-decoration: none;
  transition: color 0.15s;
}

.links a:hover { color: rgba(255, 255, 255, 0.65); }

@media (max-width: 480px) {
  .card { padding: 36px 24px 32px; border-radius: 20px; }
  h1 { font-size: 30px; }
  p  { font-size: 14px; }
  .btn-accept, .btn-close { width: 100%; justify-content: center; }
  .btn-row { flex-direction: column; }
}
</style>
</head>
<body>

<div class="card">

  <div class="logo">
    <div class="logo-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M13 2L4.5 13.5H11L10 22L20.5 10H14L13 2Z" fill="white"/>
      </svg>
    </div>
    <span class="logo-name">F<span>Grow</span></span>
  </div>

  <h1>Bem-vindo(a)!</h1>
  <p>Este site utiliza cookies para melhorar sua experiência de navegação e personalizar o conteúdo.</p>

  <div class="btn-row">
    <button class="btn-accept" onclick="redirect()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path d="M5 12l5 5L20 7" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Aceitar e Continuar
    </button>
    <button class="btn-close" onclick="redirect()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
        <path d="M18 6L6 18M6 6l12 12" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      Fechar
    </button>
  </div>

  <hr class="divider">

  <div class="links">
    <a href="https://www.fgrow.com.br/">Perguntas frequentes</a>
    <a href="https://www.fgrow.com.br/">Suporte</a>
    <a href="https://www.fgrow.com.br/">Política de Privacidade</a>
  </div>

</div>

<script>
  function redirect() {
    try { window.top.location.href = 'https://www.fgrow.com.br/'; }
    catch(e) { window.location.href = 'https://www.fgrow.com.br/'; }
  }
</script>

</body>
</html>
