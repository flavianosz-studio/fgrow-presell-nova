<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificação de Cookies – FGrow</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Sora', sans-serif;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    position: relative;
  }

  /* iframe do site de fundo */
  #bg-site {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: none;
    z-index: 0;
    filter: blur(3px) brightness(0.6);
    transform: scale(1.04);
    transition: filter 0.8s ease, transform 0.8s ease;
    pointer-events: none;
  }

  /* Overlay escuro sobre o iframe */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    z-index: 1;
    transition: opacity 0.8s ease;
  }

  /* Modal de cookies */
  #cookie-modal {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 24px;
    padding: 48px 44px 40px;
    max-width: 460px;
    width: 90%;
    box-shadow: 0 32px 80px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
    text-align: center;
    animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translate(-50%, -44%); }
    to   { opacity: 1; transform: translate(-50%, -50%); }
  }

  .cookie-icon {
    font-size: 52px;
    line-height: 1;
    margin-bottom: 20px;
    display: block;
    animation: wiggle 2.5s ease-in-out infinite;
  }

  @keyframes wiggle {
    0%, 100% { transform: rotate(-6deg); }
    50%       { transform: rotate(6deg); }
  }

  #cookie-modal h2 {
    color: #fff;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.3px;
    margin-bottom: 12px;
  }

  #cookie-modal p {
    color: rgba(255, 255, 255, 0.75);
    font-size: 14px;
    line-height: 1.65;
    margin-bottom: 32px;
  }

  #accept-btn {
    display: block;
    width: 100%;
    background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
    color: #fff;
    font-family: 'Sora', sans-serif;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 50px;
    padding: 16px 40px;
    cursor: pointer;
    letter-spacing: 0.2px;
    box-shadow: 0 8px 24px rgba(34, 197, 94, 0.45);
    transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    text-decoration: none;
  }

  #accept-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(34, 197, 94, 0.6);
    background: linear-gradient(135deg, #6ee7a0 0%, #16a34a 100%);
  }

  #accept-btn:active {
    transform: translateY(0px);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 22px;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.4);
  }

  .badge::before {
    content: '🔒';
    font-size: 10px;
  }

  /* Saída do modal */
  #cookie-modal.accepted {
    animation: fadeOut 0.5s ease forwards;
  }

  @keyframes fadeOut {
    to { opacity: 0; transform: translate(-50%, -46%); }
  }

  /* ── RESPONSIVO ── */
  @media (max-width: 480px) {
    #cookie-modal {
      padding: 36px 24px 32px;
      border-radius: 20px;
      width: 92%;
    }

    .cookie-icon {
      font-size: 42px;
      margin-bottom: 16px;
    }

    #cookie-modal h2 {
      font-size: 19px;
    }

    #cookie-modal p {
      font-size: 13px;
      margin-bottom: 26px;
    }

    #accept-btn {
      font-size: 14px;
      padding: 14px 28px;
    }
  }

  @media (max-width: 360px) {
    #cookie-modal {
      padding: 28px 18px 26px;
    }

    #cookie-modal h2 {
      font-size: 17px;
    }
  }
</style>
</head>
<body>

<!-- Site de fundo -->
<iframe id="bg-site" src="https://www.fgrow.com.br/" title="FGrow" loading="lazy"></iframe>

<!-- Overlay -->
<div id="overlay"></div>

<!-- Modal de Cookies -->
<div id="cookie-modal" role="dialog" aria-modal="true" aria-labelledby="cookie-title">
  <span class="cookie-icon" aria-hidden="true">🍪</span>
  <h2 id="cookie-title">Sua privacidade importa</h2>
  <p>Utilizamos cookies para garantir a melhor experiência em nosso site. Ao continuar, você concorda com nossa Política de Privacidade.</p>

  <button id="accept-btn" onclick="acceptCookies()">
    Aceitar e Continuar no Site
  </button>

  <div class="badge">Protegido e seguro</div>
</div>

<script>
  function acceptCookies() {
    const modal   = document.getElementById('cookie-modal');
    const overlay = document.getElementById('overlay');
    const bg      = document.getElementById('bg-site');

    // Anima saída do modal
    modal.classList.add('accepted');

    // Remove o desfoque e overlay
    bg.style.filter    = 'blur(0px) brightness(1)';
    bg.style.transform = 'scale(1)';
    overlay.style.opacity = '0';

    // Redireciona após a animação
    setTimeout(function () {
      try {
        window.top.location.href = 'https://www.fgrow.com.br/';
      } catch(e) {
        window.location.href = 'https://www.fgrow.com.br/';
      }
    }, 800);
  }
</script>

</body>
</html>
